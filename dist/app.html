<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>خوش كلام — تدريب اللهجة الكويتية</title>
<meta name="description" content="مدرّب اللهجة الكويتية — تكرار متباعد، تمارين نطق، وبراغماتية" />
<meta name="theme-color" content="#0d1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="خوش كلام" />
<link rel="manifest" id="manifestLink" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* خوش كلام — dark, calm, Arabic-first. */
:root {
  --bg: #0d1117;
  --bg-raised: #161c26;
  --bg-card: #1a2230;
  --hairline: rgb(231 236 242 / 0.09);
  --hairline-strong: rgb(231 236 242 / 0.2);
  --ink: #e9edf3;
  --ink-dim: rgb(233 237 243 / 0.64);
  --ink-faint: rgb(233 237 243 / 0.4);
  --green: #2fbf71;   /* Kuwait green, brightened for dark bg */
  --red: #e5545e;
  --gold: #e3b45c;
  --blue: #5ca8e8;
  --radius: 16px;
  --radius-chip: 10px;
  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-ar: "Amiri", "Traditional Arabic", "Times New Roman", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* a class-level display rule outranks the hidden attribute without this */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  min-height: 100dvh;
  padding-bottom: calc(4.6rem + env(safe-area-inset-bottom));
  background-image: radial-gradient(1200px 500px at 50% -10%, rgb(47 191 113 / 0.07), transparent 60%);
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea {
  font-family: inherit; color: var(--ink);
  background: var(--bg-raised);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-chip);
  padding: 0.55rem 0.7rem; font-size: 1rem; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid rgb(47 191 113 / 0.5); }

/* ── chrome ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(0.8rem + env(safe-area-inset-top)) 1.1rem 0.8rem;
  max-width: 640px; margin: 0 auto;
}
.brand-mark { font-family: var(--font-ar); font-size: 1.5rem; font-weight: 700; color: var(--green); }
.brand-sub { display: block; font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.02em; }
.streak { font-size: 0.95rem; color: var(--gold); font-weight: 500; }

main { max-width: 640px; margin: 0 auto; padding: 0.3rem 1.1rem 2rem; }

.tabs {
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 10;
  display: flex; justify-content: space-around;
  background: rgb(13 17 23 / 0.92); backdrop-filter: blur(12px);
  border-top: 1px solid var(--hairline);
  padding: 0.4rem 0.3rem calc(0.4rem + env(safe-area-inset-bottom));
}
.tab {
  flex: 1; text-align: center; font-size: 0.78rem; color: var(--ink-faint);
  padding: 0.25rem 0; border-radius: var(--radius-chip); position: relative;
}
.tab .tab-ico { display: block; font-size: 1.05rem; margin-bottom: 0.1rem; }
.tab.active { color: var(--green); }
.pill {
  position: absolute; top: -2px; inset-inline-start: 50%; margin-inline-start: 0.9rem;
  background: var(--red); color: #fff; font-size: 0.62rem; font-weight: 700;
  border-radius: 99px; padding: 0.05rem 0.35rem; min-width: 1.1rem;
}
.pill:empty { display: none; }

/* ── shared ── */
.panel {
  background: var(--bg-card); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 1.1rem; margin-bottom: 0.9rem;
}
.microlabel { font-size: 0.68rem; letter-spacing: 0.06em; color: var(--ink-faint); }
.h-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin: 1rem 0 0.6rem; }
h2 { font-size: 1.05rem; font-weight: 700; }
.btn {
  display: inline-block; border-radius: var(--radius-chip);
  padding: 0.6rem 1.1rem; font-size: 0.95rem; font-weight: 500;
  border: 1px solid var(--hairline-strong); background: var(--bg-raised);
  transition: transform 0.06s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--green); border-color: var(--green); color: #06130c; font-weight: 700; }
.btn-ghost { border-color: transparent; color: var(--ink-dim); }
.btn-danger { color: var(--red); border-color: rgb(229 84 94 / 0.4); }
.btn-sm { padding: 0.35rem 0.7rem; font-size: 0.82rem; }
.tag {
  display: inline-block; font-size: 0.68rem; border-radius: 99px;
  padding: 0.12rem 0.55rem; border: 1px solid var(--hairline-strong); color: var(--ink-dim);
}
.tag-kw { color: var(--green); border-color: rgb(47 191 113 / 0.45); }
.tag-msa { color: var(--blue); border-color: rgb(92 168 232 / 0.45); }
.tag-phrase { color: var(--gold); border-color: rgb(227 180 92 / 0.45); }
.tag-pair { color: #b598e8; border-color: rgb(181 152 232 / 0.45); }
.tag-tip { color: var(--ink-dim); }
.tag-bad { color: var(--red); border-color: rgb(229 84 94 / 0.45); }

/* ── today / session ── */
.day-summary { display: flex; gap: 0.9rem; }
.day-summary .cell { flex: 1; text-align: center; padding: 0.7rem 0.2rem; background: var(--bg-raised); border-radius: var(--radius-chip); }
.cell b { display: block; font-size: 1.4rem; }
.cell span { font-size: 0.72rem; color: var(--ink-faint); }
.progressbar { height: 6px; background: var(--bg-raised); border-radius: 99px; overflow: hidden; margin: 0.9rem 0; }
.progressbar > div { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.25s ease; }

.card-face { text-align: center; padding: 1.6rem 0.6rem 1.2rem; min-height: 15rem; display: flex; flex-direction: column; justify-content: center; gap: 0.7rem; }
.card-mode { font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.05em; }
.card-ar { font-family: var(--font-ar); font-size: 2.3rem; line-height: 1.5; }
.card-ar.cloze { font-size: 1.55rem; color: var(--ink); }
.card-ar .blank { color: var(--gold); letter-spacing: 0.05em; }
.card-en { font-size: 1.15rem; color: var(--ink-dim); direction: ltr; }
.card-tr { font-size: 0.95rem; color: var(--ink-faint); direction: ltr; font-style: italic; }
.card-ex { font-family: var(--font-ar); font-size: 1.2rem; color: var(--ink-dim); line-height: 1.9; border-top: 1px dashed var(--hairline-strong); padding-top: 0.8rem; margin-top: 0.4rem; }
.card-note { font-size: 0.82rem; color: var(--gold); line-height: 1.7; }
.grade-row { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
.grade-row .btn { flex: 1; text-align: center; padding: 0.8rem 0.2rem; }
.g1 { color: var(--red); border-color: rgb(229 84 94 / 0.5); }
.g2 { color: var(--gold); border-color: rgb(227 180 92 / 0.5); }
.g3 { color: var(--green); border-color: rgb(47 191 113 / 0.5); }
.g4 { color: var(--blue); border-color: rgb(92 168 232 / 0.5); }
.grade-sub { display: block; font-size: 0.62rem; color: var(--ink-faint); margin-top: 0.15rem; }
.flip-hint { text-align: center; color: var(--ink-faint); font-size: 0.75rem; margin-top: 0.5rem; }

.challenge li { list-style: none; display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0; border-bottom: 1px dashed var(--hairline); }
.challenge li:last-child { border-bottom: none; }
.challenge input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--green); flex: none; }
.challenge .w-ar { font-family: var(--font-ar); font-size: 1.15rem; }
.challenge .done .w-ar { color: var(--green); }

/* ── words list ── */
.toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
.toolbar input[type="search"] { flex: 1; min-width: 10rem; }
.toolbar select { width: auto; }
.word-row { display: flex; align-items: flex-start; gap: 0.7rem; padding: 0.75rem 0.2rem; border-bottom: 1px solid var(--hairline); }
.word-row .w-main { flex: 1; min-width: 0; }
.word-row .w-ar { font-family: var(--font-ar); font-size: 1.3rem; }
.word-row .w-en { font-size: 0.85rem; color: var(--ink-dim); direction: ltr; text-align: end; }
.word-row .w-meta { font-size: 0.7rem; color: var(--ink-faint); margin-top: 0.15rem; }
.word-detail { background: var(--bg-raised); border-radius: var(--radius-chip); padding: 0.8rem; margin: 0.4rem 0 0.6rem; font-size: 0.9rem; line-height: 1.9; }
.word-detail .card-ex { font-size: 1.05rem; border: none; padding: 0.3rem 0 0; margin: 0; }
.form-grid { display: grid; gap: 0.6rem; }
label.f { font-size: 0.75rem; color: var(--ink-faint); display: block; }
label.f > * { margin-top: 0.25rem; }

/* ── verify ── */
.verdict { font-size: 0.85rem; line-height: 1.8; color: var(--ink-dim); margin: 0.5rem 0; }
.v-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }

/* ── stats ── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.forecast { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-top: 0.8rem; }
.forecast .bar { flex: 1; background: rgb(47 191 113 / 0.55); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.forecast .bar span { position: absolute; top: -1.2rem; right: 0; left: 0; text-align: center; font-size: 0.62rem; color: var(--ink-faint); }
.forecast .bar em { position: absolute; bottom: -1.3rem; right: 0; left: 0; text-align: center; font-size: 0.6rem; color: var(--ink-faint); font-style: normal; }

.empty { text-align: center; color: var(--ink-faint); padding: 2.5rem 1rem; line-height: 2; }
.empty .big { font-size: 2rem; display: block; margin-bottom: 0.4rem; }
a { color: var(--blue); }
.note-info { font-size: 0.8rem; color: var(--ink-faint); line-height: 1.9; }

/* ── bilingual layer ──
   Arabic always leads; the English sits beneath it, quieter and smaller.
   In Arabic-only mode the .ar-only body class removes the English entirely,
   along with the transliterations and glosses on cards. */
.bi { display: block; }
.bi-ar { display: block; }
.bi-en,
.bi-inline {
  font-family: var(--font-ui);
  font-weight: 400;
  letter-spacing: 0;
  direction: ltr;
  unicode-bidi: isolate;
  color: var(--ink-faint);
}
.bi-en { display: block; font-size: 0.74em; line-height: 1.4; margin-top: 0.1em; }
.bi-inline { font-size: 0.86em; opacity: 0.75; }
h2 .bi-en { font-size: 0.62em; }
.note-info .bi-en,
.verdict .bi-en { font-size: 0.92em; opacity: 0.85; }
.tab .bi-en { font-size: 0.82em; margin-top: 0; }
.grade-sub .bi-en { font-size: 0.9em; }
.tag .bi-inline { font-size: 0.9em; }
.ar-only .card-tr,
.ar-only .card-en,
.ar-only .w-en,
.ar-only .en-only { display: none; }

/* ── language toggle ── */
.topbar-right { display: flex; align-items: center; gap: 0.6rem; }
.langtoggle {
  display: inline-flex;
  border: 1px solid var(--hairline-strong);
  border-radius: 99px;
  overflow: hidden;
}
.langtoggle button {
  padding: 0.24rem 0.55rem;
  font-size: 0.7rem;
  line-height: 1.3;
  color: var(--ink-faint);
  transition: background-color 0.15s ease, color 0.15s ease;
}
.langtoggle button.active { background: rgb(47 191 113 / 0.16); color: var(--green); }
.langtoggle button:focus-visible,
.tab:focus-visible,
.btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ── arena ──
   The game screen leans on one accent (green) for progress and reserves
   red/gold strictly for loss and reward, so state reads at a glance. */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.mode-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem;
  background: var(--bg-card); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 0.9rem; text-align: start;
  transition: border-color 0.15s ease, transform 0.06s ease;
}
.mode-card:active { transform: scale(0.98); }
.mode-card:hover:not(.locked) { border-color: rgb(47 191 113 / 0.45); }
.mode-card.locked { opacity: 0.45; cursor: not-allowed; }
.mode-ico { font-size: 1.3rem; color: var(--green); }
.mode-name { font-size: 0.95rem; font-weight: 500; line-height: 1.25; }
.mode-best { font-size: 0.68rem; color: var(--ink-faint); }
.rank-name { font-family: var(--font-ar); font-size: 1.5rem; color: var(--green); }
.freeze { font-size: 1rem; color: var(--blue); }
.xpbar { height: 8px; background: var(--bg-raised); border-radius: 99px; overflow: hidden; margin: 0.6rem 0 0.35rem; }
.xpbar > div { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.4s ease; }
.xpbar.goal > div { background: var(--gold); }
.goal-num { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.goal-done { color: var(--green); font-size: 0.85rem; margin-top: 0.4rem; }

.arena-top { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.8rem; }
.hearts { color: var(--red); font-size: 1rem; letter-spacing: 0.08em; }
.combo { color: var(--gold); font-weight: 700; }
.q-face { padding: 1.3rem 0.3rem 1rem; text-align: center; }
.q-ar { font-family: var(--font-ar); font-size: 1.55rem; line-height: 1.85; }
.q-en { font-size: 1.25rem; color: var(--ink-dim); direction: ltr; }
.q-weak {
  margin-top: 0.7rem; font-family: var(--font-ar); font-size: 1.05rem;
  color: var(--ink-faint); text-decoration: line-through; text-decoration-color: rgb(229 84 94 / 0.5);
}
.opts { display: grid; gap: 0.5rem; }
.opt {
  border: 1px solid var(--hairline-strong); border-radius: var(--radius-chip);
  background: var(--bg-raised); padding: 0.75rem 0.9rem; text-align: start;
  font-family: var(--font-ar); font-size: 1.2rem; line-height: 1.6;
  transition: border-color 0.12s ease, background-color 0.12s ease;
}
.opt-long { font-size: 1.02rem; }
.opt:hover:not(:disabled) { border-color: var(--green); }
.opt.right { border-color: var(--green); background: rgb(47 191 113 / 0.14); }
.opt.wrong { border-color: var(--red); background: rgb(229 84 94 / 0.13); }
.opt.dim { opacity: 0.4; }
.verdict-box {
  margin-top: 0.9rem; padding: 0.9rem; border-radius: var(--radius-chip);
  border: 1px solid var(--hairline-strong);
}
.verdict-box.ok { border-color: rgb(47 191 113 / 0.45); background: rgb(47 191 113 / 0.07); }
.verdict-box.no { border-color: rgb(229 84 94 / 0.45); background: rgb(229 84 94 / 0.07); }
.verdict-head { font-weight: 700; margin-bottom: 0.3rem; }
.verdict-ref { font-family: var(--font-ar); font-size: 1.25rem; color: var(--green); margin-bottom: 0.4rem; }
.verdict-why { font-size: 0.88rem; color: var(--ink-dim); line-height: 1.85; }
.result-title { font-size: 1.15rem; font-weight: 700; }
.result-score { font-family: var(--font-display, inherit); font-size: 3rem; color: var(--green); line-height: 1.1; font-variant-numeric: tabular-nums; }
.miss { padding: 0.6rem 0; border-bottom: 1px dashed var(--hairline); }
.miss:last-child { border-bottom: none; }
.miss-ref { font-family: var(--font-ar); font-size: 1.15rem; color: var(--gold); }
.miss-why { font-size: 0.82rem; color: var(--ink-dim); line-height: 1.8; }

/* six tabs need a slightly tighter label */
.tabs { gap: 0.1rem; }
.tab { font-size: 0.7rem; }
.tab .tab-ico { font-size: 0.95rem; }
@media (max-width: 380px) { .tab { font-size: 0.62rem; } .mode-grid { grid-template-columns: 1fr; } }

/* ── auth gate ── */
body.auth-mode { padding-bottom: 0; }
body.auth-mode .topbar { visibility: hidden; }
.auth-wrap { display: flex; align-items: center; justify-content: center; min-height: 78dvh; padding: 1rem 0; }
.auth-card {
  width: 100%; max-width: 22rem; background: var(--bg-card);
  border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 1.8rem 1.4rem; text-align: center;
}
.auth-brand { font-family: var(--font-ar); font-size: 2.1rem; font-weight: 700; color: var(--green); }
.auth-sub { font-size: 0.75rem; color: var(--ink-faint); margin-top: 0.15rem; }
.auth-card .f { text-align: start; }
.auth-msg { margin-top: 0.9rem; font-size: 0.85rem; color: var(--gold); line-height: 1.7; white-space: pre-line; }
.sync-msg { white-space: pre-line; color: var(--gold); }
/* which door: password or emailed code. Same shape as the language toggle. */
.authways {
  display: flex;
  gap: 0.35rem;
  margin-bottom: 0.9rem;
  border: 1px solid var(--hairline-strong);
  border-radius: 99px;
  padding: 0.2rem;
}
.authways button {
  flex: 1;
  padding: 0.4rem 0.5rem;
  border-radius: 99px;
  font-size: 0.78rem;
  color: var(--ink-faint);
  transition: background-color 0.15s ease, color 0.15s ease;
}
.authways button.on { background: rgb(47 191 113 / 0.16); color: var(--green); }
.authways button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.code-input {
  text-align: center; font-size: 1.6rem; letter-spacing: 0.45em;
  font-variant-numeric: tabular-nums; padding-inline-start: 0.45em;
}

/* ── sync status dot ── */
.syncdot {
  width: 0.5rem; height: 0.5rem; border-radius: 50%; flex: none;
  background: var(--ink-faint); transition: background-color 0.25s ease;
}
.syncdot.ok { background: var(--green); }
.syncdot.pending { background: var(--gold); }
.syncdot.syncing { background: var(--gold); animation: pulse 1s ease-in-out infinite; }
.syncdot.error { background: var(--red); }
.syncdot.offline { background: var(--ink-faint); box-shadow: 0 0 0 2px rgb(233 237 243 / 0.12); }
.syncdot.idle { opacity: 0.35; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ── practice ── */
.src-row {
  display: block; width: 100%; text-align: start; color: inherit; text-decoration: none;
  padding: 0.7rem 0; border-bottom: 1px solid var(--hairline);
}
.src-row:last-child { border-bottom: none; }
.src-title { font-family: var(--font-ar); font-size: 1.15rem; line-height: 1.6; }
.src-note { font-size: 0.75rem; color: var(--ink-faint); line-height: 1.7; margin-top: 0.15rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
.chip {
  display: inline-block; font-size: 0.78rem; padding: 0.3rem 0.65rem; border-radius: 99px;
  border: 1px solid var(--hairline-strong); color: var(--ink-dim); text-decoration: none;
}
.chip.on { border-color: var(--green); color: var(--green); background: rgb(47 191 113 / 0.12); }
.chip.no { border-color: rgb(229 84 94 / 0.45); color: var(--red); }
.pill-inline {
  position: absolute; top: 0.5rem; inset-inline-end: 0.5rem;
  background: var(--red); color: #fff; font-size: 0.62rem; font-weight: 700;
  border-radius: 99px; padding: 0.05rem 0.4rem;
}
.mode-card { position: relative; }

.yt-wrap { position: relative; padding-top: 56.25%; border-radius: var(--radius-chip); overflow: hidden; background: #000; }
.yt-wrap iframe, .yt-wrap > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.clock { font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--green); }
.ctrl-row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.7rem; }
.seg { font-size: 0.72rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.reader { line-height: 2.4; }
.reader p { font-family: var(--font-ar); font-size: 1.5rem; margin-bottom: 1.4rem; max-width: 38ch; }
.rw { cursor: pointer; border-radius: 4px; padding: 0 2px; transition: background-color 0.12s ease; }
.rw:hover { background: rgb(233 237 243 / 0.06); }
.rw.stumble { background: rgb(227 180 92 / 0.22); color: var(--gold); }

.mono-q { font-family: var(--font-ar); font-size: 1.5rem; line-height: 1.9; margin: 0.6rem 0 1rem; }
.countdown { font-size: 3.2rem; text-align: center; color: var(--green); font-variant-numeric: tabular-nums; line-height: 1.1; }
.countdown.low { color: var(--red); }
.concept { font-size: 1.5rem; text-align: center; margin-top: 0.6rem; }
.banned { justify-content: center; }
.big-num { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.msg-answer { font-family: var(--font-ar); font-size: 1.1rem; line-height: 2; color: var(--ink-dim); margin-top: 0.4rem; white-space: pre-wrap; }
.microlabel.stale { color: var(--red); }

<script>
/*
 * FSRS (Free Spaced Repetition Scheduler), v4.5 default parameters.
 * The best openly published scheduling algorithm (Ye et al.), successor to
 * SM-2. Each card carries {difficulty, stability, due, last, reps, lapses,
 * state}. Grades: 1 = نسيت (Again), 2 = صعبة (Hard), 3 = زين (Good),
 * 4 = سهلة (Easy).
 */
const FSRS = (() => {
  const W = [
    0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474,
    0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755,
  ];
  const DECAY = -0.5;
  const FACTOR = 19 / 81; // so R(t=S) = 0.9
  const REQUEST_RETENTION = 0.9;
  const MAX_INTERVAL = 365;
  const DAY = 24 * 60 * 60 * 1000;

  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

  function retrievability(elapsedDays, stability) {
    if (stability <= 0) return 0;
    return Math.pow(1 + (FACTOR * elapsedDays) / stability, DECAY);
  }

  function initDifficulty(grade) {
    return clamp(W[4] - (grade - 3) * W[5], 1, 10);
  }

  function initStability(grade) {
    return Math.max(W[grade - 1], 0.1);
  }

  function nextDifficulty(d, grade) {
    const next = d - W[6] * (grade - 3);
    // mean-revert toward the "Easy" starting difficulty
    return clamp(W[7] * initDifficulty(4) + (1 - W[7]) * next, 1, 10);
  }

  function stabilityAfterRecall(d, s, r, grade) {
    const hardPenalty = grade === 2 ? W[15] : 1;
    const easyBonus = grade === 4 ? W[16] : 1;
    return (
      s *
      (1 +
        Math.exp(W[8]) *
          (11 - d) *
          Math.pow(s, -W[9]) *
          (Math.exp(W[10] * (1 - r)) - 1) *
          hardPenalty *
          easyBonus)
    );
  }

  function stabilityAfterForget(d, s, r) {
    const sf =
      W[11] *
      Math.pow(d, -W[12]) *
      (Math.pow(s + 1, W[13]) - 1) *
      Math.exp(W[14] * (1 - r));
    return Math.min(sf, s);
  }

  function intervalDays(stability) {
    const days =
      (stability / FACTOR) * (Math.pow(REQUEST_RETENTION, 1 / DECAY) - 1);
    return clamp(Math.round(days), 1, MAX_INTERVAL);
  }

  function emptyCard() {
    return {
      difficulty: 0,
      stability: 0,
      due: 0, // 0 = new, never studied
      last: 0,
      reps: 0,
      lapses: 0,
      state: "new", // new | learning | review
    };
  }

  /** Apply a grade to a card. Returns a NEW card object. */
  function grade(card, g, now = Date.now()) {
    const c = { ...card };
    if (c.state === "new" || c.reps === 0) {
      c.difficulty = initDifficulty(g);
      c.stability = initStability(g);
      c.state = g === 1 ? "learning" : "review";
    } else {
      const elapsed = Math.max(0, (now - c.last) / DAY);
      const r = retrievability(elapsed, c.stability);
      if (g === 1) {
        c.lapses += 1;
        c.stability = stabilityAfterForget(c.difficulty, c.stability, r);
        c.state = "learning";
      } else {
        c.stability = stabilityAfterRecall(c.difficulty, c.stability, r, g);
        c.state = "review";
      }
      c.difficulty = nextDifficulty(c.difficulty, g);
    }
    c.reps += 1;
    c.last = now;
    // Again re-queues within the session (handled by the app); its persisted
    // due date is tomorrow so a missed session still resurfaces it first.
    const days = g === 1 ? 1 : intervalDays(c.stability);
    c.due = now + days * DAY;
    return c;
  }

  return { emptyCard, grade, retrievability, intervalDays, DAY };
})();
</script>

      { who: "مسؤول كبير", ar: "أستأذنكم بسؤال: شنو الاعتبارات اللي بُني عليها القرار؟" },

</script>
<script>
/*
 * ARENA — التمرين. The game mode you enter and play, separate from the
 * daily spaced-repetition session.
 *
 * What is borrowed from Duolingo, and why:
 *   hearts        — stakes. A round can be lost, so attention is real.
 *   XP + ranks    — a long arc of progress that survives any single bad day.
 *   daily XP goal — a target that is finishable in five minutes.
 *   streak freeze — earned, not bought; protects a real streak from one bad day.
 *   combo         — rewards sustained accuracy inside a round.
 *   end-of-round  — every miss is shown WITH its explanation.
 * Deliberately NOT borrowed: leagues (there is nobody to compete with) and
 * a gem shop (nothing worth buying). Both would be theatre here.
 *
 * Arena never writes to the FSRS scheduler — recognising a word among four
 * options is not the same evidence as recalling it cold, so it must not move
 * a due date. Misses are recorded instead, and the daily session puts those
 * words first among the cards already due.
 */
function createArena(ctx) {
  const { esc, t, ti, ts, S, bilingual, save, allWords, isStudyable } = ctx;
  const store = () => ctx.store();

  const RANKS = [
    { xp: 0, key: "rankNovice" },
    { xp: 300, key: "rankListener" },
    { xp: 900, key: "rankTalker" },
    { xp: 2000, key: "rankDebater" },
    { xp: 4000, key: "rankEloquent" },
    { xp: 7500, key: "rankMaster" },
  ];
  const HEARTS = 5;
  const ROUND_LEN = 10;

  const game = () => {
    const s = store();
    s.game ||= {};
    const g = s.game;
    g.xp ??= 0; g.best ??= {}; g.rounds ??= 0; g.misses ??= {};
    g.freezes ??= 0; g.dailyGoal ??= 30; g.xpLog ??= {}; g.frozen ??= [];
    return g;
  };

  function rankOf(xp) {
    let i = 0;
    for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k].xp) i = k;
    return { index: i, ...RANKS[i], next: RANKS[i + 1] || null };
  }

  // ── question builders ────────────────────────────────────────────────
  const shuffle = (a) => {
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const sample = (arr, n) => shuffle([...arr]).slice(0, n);

  /** Blank the target word out of its own example sentence. */
  function blankOut(word) {
    if (!word.ex || word.ex === "—") return null;
    const head = word.ar.replace(/^ال/, "").split(/[\s/]+/)[0];
    if (head.length < 3) return null;
    const toks = word.ex.split(" ");
    let best = -1, bestLen = 2;
    toks.forEach((tk, i) => {
      const l = lcs(tk.replace(/[،.؟!:—«»"()]/g, ""), head);
      if (l > bestLen) { bestLen = l; best = i; }
    });
    if (best < 0) return null;
    return toks.map((tk, i) => (i === best ? "＿＿＿" : tk)).join(" ");
  }
  function lcs(a, b) {
    let m = 0;
    for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) {
      let k = 0; while (a[i + k] && a[i + k] === b[j + k]) k++;
      if (k > m) m = k;
    }
    return m;
  }

  function deck() { return allWords().filter(isStudyable); }

  const MODES = {
    // كمّل الجملة — works in both language modes, so it is the default
    cloze: {
      key: "cloze", labelKey: "modeClozeGame", icon: "◧",
      available: () => deck().filter(blankOut).length >= 8,
      build() {
        const pool = deck().filter(blankOut);
        return sample(pool, ROUND_LEN).map((w) => {
          const wrong = sample(pool.filter((x) => x.id !== w.id && x.reg === w.reg), 3);
          const filler = sample(pool.filter((x) => x.id !== w.id), 3);
          const opts = shuffle([w, ...(wrong.length === 3 ? wrong : filler)].slice(0, 4));
          return {
            id: w.id, prompt: blankOut(w), promptClass: "q-ar",
            options: opts.map((o) => o.ar), answer: opts.findIndex((o) => o.id === w.id),
            why: w.en, ref: w.ar,
          };
        });
      },
    },
    // شنو معناها — needs the English gloss, so bilingual only
    meaning: {
      key: "meaning", labelKey: "modeMeaningGame", icon: "◑",
      available: () => bilingual() && deck().length >= 8,
      build() {
        const pool = deck().filter((w) => w.en);
        return sample(pool, ROUND_LEN).map((w) => {
          const opts = shuffle([w, ...sample(pool.filter((x) => x.id !== w.id), 3)]);
          return {
            id: w.id, prompt: w.en, promptClass: "q-en",
            options: opts.map((o) => o.ar), answer: opts.findIndex((o) => o.id === w.id),
            why: w.ex && w.ex !== "—" ? w.ex : w.en, ref: w.ar,
          };
        });
      },
    },
    gender: {
      key: "gender", labelKey: "modeGenderGame", icon: "⚥",
      available: () => true,
      build() {
        return sample(SEED_GENDER, ROUND_LEN).map((d) => {
          // the source data always lists the correct form first, so the
          // options MUST be shuffled or the round is won by tapping option 1
          const order = shuffle(d.options.map((_, i) => i));
          return {
            id: d.id, prompt: d.prompt, promptClass: "q-ar",
            options: order.map((i) => d.options[i]), answer: order.indexOf(d.answer),
            why: bilingual() ? `${d.rule}\n${d.en}` : d.rule, ref: d.options[d.answer],
          };
        });
      },
    },
    upgrade: {
      key: "upgrade", labelKey: "modeUpgradeGame", icon: "▲",
      available: () => true,
      build() {
        return sample(SEED_UPGRADE, Math.min(ROUND_LEN, SEED_UPGRADE.length)).map((d) => {
          const idx = shuffle(d.options.map((_, i) => i));
          return {
            id: d.id, prompt: d.situation, sub: d.weak, promptClass: "q-ar",
            options: idx.map((i) => d.options[i]), answer: idx.indexOf(d.answer),
            why: d.why, ref: d.options[d.answer], long: true,
          };
        });
      },
    },
    reply: {
      key: "reply", labelKey: "modeReplyGame", icon: "⇄",
      available: () => true,
      build() {
        return sample(SEED_RESPONSES, ROUND_LEN).map((r) => {
          const opts = shuffle([r, ...sample(SEED_RESPONSES.filter((x) => x.id !== r.id), 3)]);
          return {
            id: r.id, prompt: r.call, promptClass: "q-ar",
            options: opts.map((o) => o.resp), answer: opts.findIndex((o) => o.id === r.id),
            why: bilingual() ? `${r.en}` : r.note || r.call, ref: r.resp, long: true,
          };
        });
      },
    },
    // اقرأ الموقف — situational judgement. The distractors are all sayable;
    // they are wrong for who is being addressed, not for grammar.
    situation: {
      key: "situation", labelKey: "modeSituation", icon: "☰",
      available: () => true,
      build() {
        return sample(SEED_DCT, ROUND_LEN).map((d) => {
          const order = shuffle(d.options.map((_, i) => i));
          return {
            id: d.id, prompt: d.sit, sub: d.who, subClass: "q-context", promptClass: "q-ar",
            options: order.map((i) => d.options[i]), answer: order.indexOf(d.answer),
            why: d.why, ref: d.options[d.answer], long: true,
          };
        });
      },
    },
    // سلّم السجل — same intent, three audiences; pick the right rung
    ladder: {
      key: "ladder", labelKey: "modeLadder", icon: "≡",
      available: () => true,
      build() {
        const items = [];
        for (const l of shuffle([...SEED_LADDER])) {
          for (const target of shuffle([0, 1, 2]).slice(0, 1)) {
            const order = shuffle([0, 1, 2]);
            items.push({
              id: l.id + target, prompt: l.intent, sub: `→ ${l.rungs[target].who}`, subClass: "q-context", promptClass: "q-ar",
              options: order.map((i) => l.rungs[i].ar), answer: order.indexOf(target),
              why: l.rungs.map((r) => `${r.who}: ${r.ar}`).join("\n"),
              ref: l.rungs[target].ar, long: true,
            });
          }
          if (items.length >= ROUND_LEN) break;
        }
        return items.slice(0, ROUND_LEN);
      },
    },
    proverb: {
      key: "proverb", labelKey: "modeProverbGame", icon: "❝",
      available: () => proverbPool().length >= 6,
      build() {
        const pool = proverbPool();
        return sample(pool, Math.min(ROUND_LEN, pool.length)).map((w) => {
          const opts = shuffle([w, ...sample(pool.filter((x) => x.id !== w.id), 3)]);
          const situation = (w.ex || "").split("—")[0].trim() || w.note || w.en;
          return {
            id: w.id, prompt: situation, promptClass: "q-ar",
            options: opts.map((o) => o.ar), answer: opts.findIndex((o) => o.id === w.id),
            why: w.note || w.en, ref: w.ar, long: true,
          };
        });
      },
    },
  };
  const proverbPool = () => deck().filter((w) => w.topic === "أمثال");

  // ── round state ──────────────────────────────────────────────────────
  let round = null; // {mode, qs, i, score, hearts, combo, answered, correct, misses[]}

  function start(modeKey) {
    const qs = MODES[modeKey].build();
    round = { mode: modeKey, qs, i: 0, score: 0, hearts: HEARTS, combo: 0, best: 0, answered: null, correct: 0, misses: [], t0: Date.now() };
    ctx.rerender();
  }

  function answer(choice) {
    if (round.answered !== null) return;
    const q = round.qs[round.i];
    const right = choice === q.answer;
    const secs = (Date.now() - round.t0) / 1000;
    let gained = 0;
    if (right) {
      round.combo += 1;
      round.best = Math.max(round.best, round.combo);
      const speed = Math.round(Math.max(0, 50 - Math.max(0, secs - 3) * 5));
      const mult = Math.min(2, 1 + round.combo * 0.1);
      gained = Math.round((100 + speed) * mult);
      round.score += gained;
      round.correct += 1;
    } else {
      round.combo = 0;
      round.hearts -= 1;
      round.misses.push(q);
      const g = game();
      g.misses[q.id] = (g.misses[q.id] || 0) + 1;
    }
    round.answered = { choice, right, gained };
    save();
    ctx.rerender();
  }

  function next() {
    if (round.hearts <= 0 || round.i >= round.qs.length - 1) return finish();
    round.i += 1;
    round.answered = null;
    round.t0 = Date.now();
    ctx.rerender();
  }

  function finish() {
    const g = game();
    const perfect = round.hearts === HEARTS && round.correct === round.qs.length;
    const xp = round.correct * 10 + (perfect ? 20 : 0);
    g.xp += xp;
    g.rounds += 1;
    g.best[round.mode] = Math.max(g.best[round.mode] || 0, round.score);
    const day = ctx.todayKey();
    g.xpLog[day] = (g.xpLog[day] || 0) + xp;
    // a streak freeze is earned every 7th day of an unbroken streak, capped at 2
    if (ctx.streak() > 0 && ctx.streak() % 7 === 0 && g.freezes < 2 && g.lastFreezeDay !== day) {
      g.freezes += 1; g.lastFreezeDay = day;
    }
    round = { ...round, done: true, xp, perfect };
    save();
    ctx.rerender();
  }

  const quit = () => { round = null; ctx.rerender(); };

  /** Consume a freeze to cover yesterday if it was missed. Called on load. */
  function applyFreeze() {
    const g = game();
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yk = ctx.todayKey(y);
    const s = store();
    const activeY = (s.log[yk]?.reviews || 0) > 0 || (g.xpLog[yk] || 0) > 0 || g.frozen.includes(yk);
    if (activeY) return;
    const d2 = new Date(); d2.setDate(d2.getDate() - 2);
    const k2 = ctx.todayKey(d2);
    const hadStreak = (s.log[k2]?.reviews || 0) > 0 || (g.xpLog[k2] || 0) > 0 || g.frozen.includes(k2);
    if (hadStreak && g.freezes > 0) { g.freezes -= 1; g.frozen.push(yk); save(); }
  }

  // ── rendering ────────────────────────────────────────────────────────
  function render() {
    if (round && round.done) return renderResult();
    if (round) return renderQuestion();
    return renderHome();
  }

  function renderHome() {
    const g = game();
    const r = rankOf(g.xp);
    const span = r.next ? r.next.xp - r.xp : 1;
    const into = r.next ? g.xp - r.xp : 1;
    const pct = r.next ? Math.min(100, Math.round((into / span) * 100)) : 100;
    const todayXp = g.xpLog[ctx.todayKey()] || 0;
    const goalPct = Math.min(100, Math.round((todayXp / g.dailyGoal) * 100));

    const modes = Object.values(MODES).map((m) => {
      const ok = m.available();
      const best = g.best[m.key] || 0;
      return `<button class="mode-card ${ok ? "" : "locked"}" ${ok ? `data-mode="${m.key}"` : "disabled"}>
        <span class="mode-ico">${m.icon}</span>
        <span class="mode-name">${t(m.labelKey)}</span>
        <span class="mode-best">${ok ? (best ? `${ti("bestScore")} ${best}` : ti("notPlayed")) : ti("modeLocked")}</span>
      </button>`;
    }).join("");

    return `
      <div class="panel">
        <div class="h-row" style="margin:0">
          <div><div class="rank-name">${t(r.key)}</div><div class="microlabel">${g.xp} XP</div></div>
          <div class="freeze" title="${esc(ts("freezeTitle"))}">❄ ${g.freezes}</div>
        </div>
        <div class="xpbar"><div style="width:${pct}%"></div></div>
        <div class="microlabel">${r.next ? ti("toNextRank", r.next.xp - g.xp) : ti("maxRank")}</div>
      </div>

      <div class="panel">
        <div class="h-row" style="margin:0"><span class="microlabel">${t("dailyGoal")}</span>
          <span class="goal-num" dir="ltr">${todayXp} / ${g.dailyGoal} XP</span></div>
        <div class="xpbar goal"><div style="width:${goalPct}%"></div></div>
        ${goalPct >= 100 ? `<div class="goal-done">${t("goalMet")}</div>` : ""}
        <label class="f" style="margin-top:0.7rem">${t("goalSize")}
          <select id="goalSel">${[20, 30, 50, 80].map((v) => `<option value="${v}" ${g.dailyGoal === v ? "selected" : ""}>${v} XP</option>`).join("")}</select>
        </label>
      </div>

      <div class="h-row"><h2>${t("chooseMode")}</h2></div>
      <div class="mode-grid">${modes}</div>

      <div class="panel note-info">
        <div class="microlabel" style="margin-bottom:0.4rem">${t("arenaHowTitle")}</div>
        ${t("arenaHow")}
      </div>`;
  }

  function renderQuestion() {
    const q = round.qs[round.i];
    const a = round.answered;
    const hearts = "♥".repeat(round.hearts) + "♡".repeat(HEARTS - round.hearts);
    const pct = Math.round((round.i / round.qs.length) * 100);

    const opts = q.options.map((o, i) => {
      let cls = "opt";
      if (a) {
        if (i === q.answer) cls += " right";
        else if (i === a.choice) cls += " wrong";
        else cls += " dim";
      }
      return `<button class="${cls} ${q.long ? "opt-long" : ""}" data-opt="${i}" ${a ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("");

    return `
      <div class="arena-top">
        <button class="btn btn-ghost btn-sm" id="quitBtn">✕</button>
        <div class="progressbar" style="flex:1; margin:0"><div style="width:${pct}%"></div></div>
        <div class="hearts">${hearts}</div>
      </div>
      <div class="panel">
        <div class="h-row" style="margin:0">
          <span class="microlabel" dir="ltr">${round.i + 1} / ${round.qs.length}</span>
          <span class="microlabel">${round.score} ${round.combo > 1 ? `<span class="combo">×${(Math.min(2, 1 + round.combo * 0.1)).toFixed(1)}</span>` : ""}</span>
        </div>
        <div class="q-face">
          <div class="${q.promptClass}">${esc(q.prompt)}</div>
          ${q.sub ? `<div class="${q.subClass || "q-weak"}">${esc(q.sub)}</div>` : ""}
        </div>
        <div class="opts">${opts}</div>
        ${a ? `<div class="verdict-box ${a.right ? "ok" : "no"}">
            <div class="verdict-head">${a.right ? `${ti("correct")} +${a.gained}` : ti("incorrect")}</div>
            ${!a.right ? `<div class="verdict-ref">${esc(q.ref)}</div>` : ""}
            <div class="verdict-why">${esc(q.why).replace(/\n/g, "<br>")}</div>
            <button class="btn btn-primary" id="nextBtn" style="width:100%; margin-top:0.7rem">${round.hearts <= 0 ? t("roundOver") : round.i >= round.qs.length - 1 ? t("finishRound") : t("nextQ")}</button>
          </div>` : ""}
      </div>`;
  }

  function renderResult() {
    const acc = Math.round((round.correct / round.qs.length) * 100);
    const g = game();
    return `
      <div class="panel" style="text-align:center">
        <div class="result-title">${round.perfect ? t("perfectRound") : round.hearts <= 0 ? t("outOfHearts") : t("roundDone")}</div>
        <div class="result-score">${round.score}</div>
        <div class="microlabel">${ti("finalScore")}</div>
        <div class="day-summary" style="margin-top:1rem">
          <div class="cell"><b>+${round.xp}</b><span>XP</span></div>
          <div class="cell"><b>${acc}٪</b><span>${ti("accuracy")}</span></div>
          <div class="cell"><b>×${round.best}</b><span>${ti("bestCombo")}</span></div>
        </div>
        ${round.score >= (g.best[round.mode] || 0) && round.score > 0 ? `<div class="goal-done" style="margin-top:0.8rem">${t("newBest")}</div>` : ""}
      </div>
      ${round.misses.length ? `<div class="panel">
        <div class="microlabel">${t("reviewMisses")}</div>
        ${round.misses.map((m) => `<div class="miss">
            <div class="miss-ref">${esc(m.ref)}</div>
            <div class="miss-why">${esc(m.why).replace(/\n/g, "<br>")}</div>
          </div>`).join("")}
      </div>` : `<div class="panel note-info">${t("noMisses")}</div>`}
      <div class="v-actions">
        <button class="btn btn-primary" id="againBtn">${t("playAgain")}</button>
        <button class="btn" id="homeBtn">${t("backToModes")}</button>
      </div>`;
  }

  function wire(stage) {
    stage.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => start(b.dataset.mode)));
    stage.querySelectorAll("[data-opt]").forEach((b) => b.addEventListener("click", () => answer(+b.dataset.opt)));
    stage.querySelector("#nextBtn")?.addEventListener("click", next);
    stage.querySelector("#quitBtn")?.addEventListener("click", quit);
    stage.querySelector("#againBtn")?.addEventListener("click", () => start(round.mode));
    stage.querySelector("#homeBtn")?.addEventListener("click", quit);
    stage.querySelector("#goalSel")?.addEventListener("change", (e) => { game().dailyGoal = +e.target.value; save(); ctx.rerender(); });
  }

  return { render, wire, game, rankOf, applyFreeze, RANKS,
    inRound: () => !!round,
    /** Tapping the arena tab mid-round returns to the mode list. */
    leave: () => { round = null; } };
}
</script>
<script>
/*
 * PRACTICE — the six production-side exercises, plus the dashboard.
 *
 * Everything except audio lives in the synced JSON state. Audio recordings
 * stay in IndexedDB on the device that made them: they are large, and a
 * one-take monologue is evidence for you, not something to ship to a server.
 * The metadata (prompt, date, unlock date, rating, notes) does sync, so the
 * review queue is correct on every device even where the audio is absent.
 *
 * Chart colours were validated against the dark surface with the dataviz
 * validator: lightness band, chroma, CVD separation, and contrast all pass.
 */
const EX_COLORS = { shadow: "#29a463", read: "#4d93d2", mono: "#b0862f", circum: "#9d80d0" };

/* ── audio store ─────────────────────────────────────────────────────── */
const AudioStore = (() => {
  const DB = "khosh-kalam-audio", STORE = "clips";
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode);
      const rq = fn(t.objectStore(STORE));
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  };
  return {
    put: (id, blob) => tx("readwrite", (s) => s.put(blob, id)),
    get: (id) => tx("readonly", (s) => s.get(id)),
    del: (id) => tx("readwrite", (s) => s.delete(id)),
    keys: () => tx("readonly", (s) => s.getAllKeys()),
  };
})();

/* ── SM-2, as specified ──────────────────────────────────────────────── */
function sm2(card, q) {
  const c = { ef: 2.5, n: 0, int: 0, due: 0, ...card };
  if (q < 3) { c.n = 0; c.int = 1; }
  else {
    c.n += 1;
    c.int = c.n === 1 ? 1 : c.n === 2 ? 6 : Math.round(c.int * c.ef);
  }
  c.ef = Math.max(1.3, c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  c.due = Date.now() + c.int * 86400000;
  c.last = Date.now();
  return c;
}

function createPractice(ctx) {
  const { esc, t, ti, ts, S, bilingual, save, todayKey } = ctx;
  const store = () => ctx.store();

  const P = () => {
    const s = store();
    s.practice ||= {};
    const p = s.practice;
    p.sessions ??= []; p.lexicon ??= []; p.monologues ??= [];
    p.circum ??= []; p.msgs ??= []; p.recent ??= [];
    return p;
  };

  let mode = null;      // null = hub, else the exercise key
  let ui = {};          // per-exercise transient state
  const DAY = 86400000;

  const logSession = (type, minutes) => {
    if (minutes < 0.5) return;
    P().sessions.push({ id: "s" + Date.now() + Math.random().toString(36).slice(2, 6),
      d: todayKey(), type, min: Math.round(minutes * 10) / 10 });
    save();
  };

  // ── 1. shadowing ────────────────────────────────────────────────────
  let yt = null, ytReady = false, loopTimer = null, shadowTimer = null;

  function loadYT(cb) {
    if (window.YT && window.YT.Player) return cb();
    if (!document.getElementById("ytapi")) {
      const s = document.createElement("script");
      s.id = "ytapi"; s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev?.(); ytReady = true; cb(); };
    if (window.YT?.Player) cb();
  }

  function mountPlayer(videoId) {
    ui.videoId = videoId;
    ui.a = null; ui.b = null; ui.elapsed = 0; ui.playing = false;
    ctx.rerender();
    loadYT(() => {
      const host = document.getElementById("ytHost");
      if (!host) return;
      yt = new YT.Player(host, {
        videoId, playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
          onReady: (e) => { e.target.setPlaybackRate(ui.rate || 1); },
          onStateChange: (e) => {
            ui.playing = e.data === YT.PlayerState.PLAYING;
            if (ui.playing) startShadowClock(); else stopShadowClock();
          },
          onError: () => { ui.ytError = true; ctx.rerender(); },
        },
      });
      clearInterval(loopTimer);
      loopTimer = setInterval(() => {
        if (!yt?.getCurrentTime || ui.a == null || ui.b == null) return;
        const tNow = yt.getCurrentTime();
        if (tNow > ui.b || tNow < ui.a - 0.5) yt.seekTo(ui.a, true);
      }, 250);
    });
  }

  function startShadowClock() {
    if (shadowTimer) return;
    ui.t0 = Date.now();
    shadowTimer = setInterval(() => {
      ui.elapsed = (ui.elapsed || 0) + 1;
      const el = document.getElementById("shadowClock");
      if (el) el.textContent = fmtClock(ui.elapsed);
      const bar = document.getElementById("shadowBar");
      if (bar) bar.style.width = Math.min(100, (ui.elapsed / 900) * 100) + "%";
    }, 1000);
  }
  function stopShadowClock() { clearInterval(shadowTimer); shadowTimer = null; }
  function teardownShadow() {
    stopShadowClock(); clearInterval(loopTimer); loopTimer = null;
    if (ui.elapsed > 30) logSession("shadow", ui.elapsed / 60);
    try { yt?.destroy?.(); } catch {}
    yt = null;
  }
  const fmtClock = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  function renderShadow() {
    const p = P();
    if (!ui.videoId) {
      return `
        ${hdr("exShadow")}
        <div class="panel">
          <div class="microlabel">${t("shPaste")}</div>
          <div class="v-actions" style="margin-top:0.5rem">
            <input id="ytUrl" dir="ltr" placeholder="https://youtube.com/watch?v=..." style="flex:1" />
            <button class="btn btn-sm btn-primary" id="ytGo">${t("shOpen")}</button>
          </div>
          ${p.recent.length ? `<div class="microlabel" style="margin-top:0.9rem">${t("shRecent")}</div>
            <div class="chips">${p.recent.slice(0, 6).map((r) => `<button class="chip" data-vid="${esc(r.id)}">${esc(r.title || r.id)}</button>`).join("")}</div>` : ""}
        </div>
        <div class="panel">
          <div class="microlabel">${t("shStarters")}</div>
          ${LIB_SHADOW.starters.map((s) => `<button class="src-row" data-vid="${esc(s.id)}" data-title="${esc(s.title)}">
              <div class="src-title">${esc(s.title)}</div><div class="src-note">${esc(s.note)}</div></button>`).join("")}
        </div>
        <div class="panel">
          <div class="microlabel">${t("shChannels")}</div>
          <div class="note-info" style="margin:0.35rem 0 0.6rem">${t("shChannelsNote")}</div>
          ${LIB_SHADOW.channels.map((c) => `<a class="src-row" href="${esc(c.url)}" target="_blank" rel="noopener">
              <div class="src-title">${esc(c.name)} <span class="tag">${esc(c.level)}</span></div>
              <div class="src-note">${esc(bilingual() ? c.note + " · " + c.noteEn : c.note)}</div></a>`).join("")}
          <div class="chips" style="margin-top:0.7rem">
            ${LIB_SHADOW.searches.map((s) => `<a class="chip" target="_blank" rel="noopener"
                href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.q)}">🔎 ${esc(s.label)}</a>`).join("")}
          </div>
        </div>`;
    }
    const seg = ui.a != null && ui.b != null ? `${ui.a.toFixed(1)}s → ${ui.b.toFixed(1)}s (${(ui.b - ui.a).toFixed(1)}s)` : "—";
    return `
      ${hdr("exShadow", true)}
      <div class="panel">
        ${ui.ytError ? `<div class="note-info" style="color:var(--red)">${t("shDead")}</div>` : ""}
        <div class="yt-wrap"><div id="ytHost"></div></div>
        <div class="h-row" style="margin:0.8rem 0 0.4rem">
          <span class="clock" id="shadowClock">${fmtClock(ui.elapsed || 0)}</span>
          <span class="microlabel">${ti("shTarget")}</span>
        </div>
        <div class="xpbar"><div id="shadowBar" style="width:${Math.min(100, ((ui.elapsed || 0) / 900) * 100)}%"></div></div>
        <div class="ctrl-row">
          <span class="microlabel">${t("shSpeed")}</span>
          ${[0.75, 1].map((r) => `<button class="chip ${(ui.rate || 1) === r ? "on" : ""}" data-rate="${r}">${r}×</button>`).join("")}
        </div>
        <div class="ctrl-row">
          <span class="microlabel">${t("shLoop")}</span>
          <button class="chip" id="setA">A</button>
          <button class="chip" id="setB">B</button>
          <button class="chip" id="clrAB">${t("shClear")}</button>
          <span class="seg" dir="ltr">${esc(seg)}</span>
        </div>
        <div class="note-info" style="margin-top:0.5rem">${t("shHow")}</div>
      </div>`;
  }

  function wireShadow(el) {
    el.querySelector("#ytGo")?.addEventListener("click", () => {
      const v = parseVideoId(document.getElementById("ytUrl").value);
      if (v) { pushRecent(v, null); mountPlayer(v); } else alert(ts("shBadUrl"));
    });
    el.querySelectorAll("[data-vid]").forEach((b) => b.addEventListener("click", () => {
      pushRecent(b.dataset.vid, b.dataset.title); mountPlayer(b.dataset.vid);
    }));
    el.querySelectorAll("[data-rate]").forEach((b) => b.addEventListener("click", () => {
      ui.rate = +b.dataset.rate; yt?.setPlaybackRate?.(ui.rate); ctx.rerender();
    }));
    el.querySelector("#setA")?.addEventListener("click", () => { ui.a = yt?.getCurrentTime?.() ?? 0; ctx.rerender(); });
    el.querySelector("#setB")?.addEventListener("click", () => {
      const b = yt?.getCurrentTime?.() ?? 0;
      if (ui.a == null || b <= ui.a) return alert(ts("shSetAFirst"));
      ui.b = b; ctx.rerender();
    });
    el.querySelector("#clrAB")?.addEventListener("click", () => { ui.a = ui.b = null; ctx.rerender(); });
  }
  function parseVideoId(u) {
    if (!u) return null;
    const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || String(u).trim().match(/^([\w-]{11})$/);
    return m ? m[1] : null;
  }
  function pushRecent(id, title) {
    const p = P();
    p.recent = [{ id, title }, ...p.recent.filter((r) => r.id !== id)].slice(0, 12);
    save();
  }

  // ── 2. read-aloud ───────────────────────────────────────────────────
  let readTimer = null;
  function renderRead() {
    const p = P();
    if (!ui.text) {
      const kinds = { column: "مقال رأي", poetry: "شعر", literary: "نثر أدبي", kuwaiti: "لهجة كويتية" };
      return `${hdr("exRead")}
        <div class="panel"><div class="note-info">${t("rdPick")}</div></div>
        ${LIB_READ.map((r) => `<button class="src-row" data-text="${esc(r.id)}">
            <div class="src-title">${esc(r.title)} <span class="tag">${esc(kinds[r.kind] || r.kind)}</span></div>
            <div class="src-note">${esc(r.source)} · ${esc(r.level)} · ${r.text.split(/\s+/).length} ${ts("rdWords")}</div>
          </button>`).join("")}`;
    }
    const words = ui.text.text.split(/(\s+)/);
    let wi = -1;
    const body = words.map((w) => {
      if (/^\s+$/.test(w)) return w.includes("\n\n") ? "</p><p>" : w;
      wi++;
      const stumbled = ui.stumbled?.has(wi);
      return `<span class="rw ${stumbled ? "stumble" : ""}" data-w="${wi}">${esc(w)}</span>`;
    }).join("");
    return `
      ${hdr("exRead", true)}
      <div class="panel">
        <div class="h-row" style="margin:0">
          <span class="clock" id="readClock">${fmtClock(ui.elapsed || 0)}</span>
          <div class="v-actions" style="margin:0">
            <button class="btn btn-sm ${ui.running ? "" : "btn-primary"}" id="readToggle">${ui.running ? t("rdPause") : t("rdStart")}</button>
            <button class="btn btn-sm" id="readDone">${t("rdFinish")}</button>
          </div>
        </div>
        <div class="microlabel" style="margin-top:0.5rem">${t("rdTapHint")} · ${ui.stumbled?.size || 0} ${ts("rdMarked")}</div>
      </div>
      <div class="panel reader"><p>${body}</p></div>`;
  }
  function wireRead(el) {
    el.querySelectorAll("[data-text]").forEach((b) => b.addEventListener("click", () => {
      ui.text = LIB_READ.find((r) => r.id === b.dataset.text);
      ui.elapsed = 0; ui.stumbled = new Set(); ui.running = false;
      ctx.rerender();
    }));
    el.querySelector("#readToggle")?.addEventListener("click", () => {
      ui.running = !ui.running;
      clearInterval(readTimer);
      if (ui.running) readTimer = setInterval(() => {
        ui.elapsed++; const c = document.getElementById("readClock"); if (c) c.textContent = fmtClock(ui.elapsed);
      }, 1000);
      ctx.rerender();
    });
    el.querySelector("#readDone")?.addEventListener("click", finishRead);
    el.querySelectorAll(".rw").forEach((s) => s.addEventListener("click", () => {
      const i = +s.dataset.w;
      ui.stumbled.has(i) ? ui.stumbled.delete(i) : ui.stumbled.add(i);
      s.classList.toggle("stumble");
      const m = el.querySelector(".microlabel"); if (m) m.innerHTML = `${t("rdTapHint")} · ${ui.stumbled.size} ${ts("rdMarked")}`;
    }));
  }
  function finishRead() {
    clearInterval(readTimer); readTimer = null;
    if (ui.elapsed > 20) logSession("read", ui.elapsed / 60);
    // every stumble becomes a lexicon entry, carrying its neighbours so the
    // phrase rule is satisfied by construction rather than by nagging
    const toks = ui.text.text.split(/\s+/);
    let added = 0;
    for (const i of ui.stumbled || []) {
      const phrase = toks.slice(Math.max(0, i - 1), i + 2).join(" ").replace(/[،.؟!]$/, "");
      if (phrase.split(/\s+/).length < 2) continue;
      P().lexicon.push({
        id: "lx" + Date.now() + "_" + i, ar: phrase, gender: "", plural: "", en: "",
        src: ui.text.title, domain: "abstract", needs: true, sm2: { ef: 2.5, n: 0, int: 0, due: Date.now() },
      });
      added++;
    }
    save();
    alert(added ? ts("rdSaved").replace("{n}", added) : ts("rdNoMarks"));
    ui = {}; ctx.rerender();
  }

  // ── 3. one-take monologue ───────────────────────────────────────────
  let rec = null, recChunks = [], recTimer = null;
  function renderMono() {
    const p = P();
    const ready = p.monologues.filter((m) => !m.rating && m.unlock <= Date.now());
    const locked = p.monologues.filter((m) => !m.rating && m.unlock > Date.now());
    if (ui.review) return renderMonoReview(ui.review);
    if (ui.prompt) {
      return `${hdr("exMono", true)}
        <div class="panel">
          <div class="microlabel">${esc(ui.prompt.domain)}</div>
          <div class="mono-q">${esc(ui.prompt.q)}</div>
          <div class="h-row"><span class="clock">${fmtClock(ui.elapsed || 0)}</span>
            <span class="microlabel">${ui.recording ? t("mnRecording") : t("mnOneTake")}</span></div>
          ${ui.recording
            ? `<button class="btn btn-danger" id="mnStop" style="width:100%">${t("mnStop")}</button>`
            : `<button class="btn btn-primary" id="mnStart" style="width:100%">${t("mnStart")}</button>`}
          <div class="note-info" style="margin-top:0.6rem">${t("mnRule")}</div>
        </div>`;
    }
    return `${hdr("exMono")}
      ${ready.length ? `<div class="panel">
        <div class="microlabel">${t("mnReady")} (${ready.length})</div>
        ${ready.map((m) => `<button class="src-row" data-review="${esc(m.id)}">
            <div class="src-title">${esc(m.q)}</div>
            <div class="src-note">${new Date(m.at).toLocaleDateString(bilingual() ? "en-GB" : "ar-KW")}</div></button>`).join("")}
      </div>` : ""}
      ${locked.length ? `<div class="panel">
        <div class="microlabel">${t("mnLocked")} (${locked.length})</div>
        ${locked.map((m) => `<div class="src-row"><div class="src-title" style="opacity:.6">${esc(m.q)}</div>
            <div class="src-note">🔒 ${ti("mnUnlocksIn", Math.ceil((m.unlock - Date.now()) / DAY))}</div></div>`).join("")}
      </div>` : ""}
      <div class="panel">
        <div class="note-info">${t("mnIntro")}</div>
        <button class="btn btn-primary" id="mnNew" style="width:100%; margin-top:0.7rem">${t("mnDraw")}</button>
      </div>`;
  }
  function renderMonoReview(m) {
    return `${hdr("exMono", true)}
      <div class="panel">
        <div class="mono-q">${esc(m.q)}</div>
        <div class="microlabel">${new Date(m.at).toLocaleDateString(bilingual() ? "en-GB" : "ar-KW")}</div>
        <audio id="mnAudio" controls style="width:100%; margin-top:0.8rem"></audio>
        <div class="microlabel" style="margin-top:0.9rem">${t("mnRate")}</div>
        <div class="grade-row">${[1, 2, 3, 4, 5].map((n) => `<button class="btn" data-rate5="${n}">${n}</button>`).join("")}</div>
        <label class="f" style="margin-top:0.7rem">${t("mnNotes")}<textarea id="mnNotes" rows="3"></textarea></label>
        <button class="btn btn-primary" id="mnSaveReview" style="width:100%; margin-top:0.6rem">${t("mnSaveReview")}</button>
      </div>`;
  }
  function wireMono(el) {
    el.querySelector("#mnNew")?.addEventListener("click", () => {
      const done = new Set(P().monologues.map((m) => m.promptId));
      const pool = LIB_MONO.filter((q) => !done.has(q.id));
      ui.prompt = (pool.length ? pool : LIB_MONO)[Math.floor(Math.random() * (pool.length || LIB_MONO.length))];
      ui.elapsed = 0; ui.recording = false; ctx.rerender();
    });
    el.querySelector("#mnStart")?.addEventListener("click", startRec);
    el.querySelector("#mnStop")?.addEventListener("click", stopRec);
    el.querySelectorAll("[data-review]").forEach((b) => b.addEventListener("click", async () => {
      ui.review = P().monologues.find((m) => m.id === b.dataset.review);
      ui.rating = 0; ctx.rerender();
      const blob = await AudioStore.get(ui.review.id).catch(() => null);
      const a = document.getElementById("mnAudio");
      if (a && blob) a.src = URL.createObjectURL(blob);
      else if (a) { a.replaceWith(Object.assign(document.createElement("div"), { className: "note-info", textContent: ts("mnNoAudio") })); }
    }));
    el.querySelectorAll("[data-rate5]").forEach((b) => b.addEventListener("click", () => {
      ui.rating = +b.dataset.rate5;
      el.querySelectorAll("[data-rate5]").forEach((x) => x.classList.toggle("btn-primary", +x.dataset.rate5 === ui.rating));
    }));
    el.querySelector("#mnSaveReview")?.addEventListener("click", () => {
      if (!ui.rating) return alert(ts("mnPickRating"));
      const m = P().monologues.find((x) => x.id === ui.review.id);
      m.rating = ui.rating; m.notes = document.getElementById("mnNotes").value.trim(); m.reviewedAt = Date.now();
      save(); ui = {}; ctx.rerender();
    });
  }
  async function startRec() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recChunks = [];
      rec = new MediaRecorder(stream);
      rec.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
      rec.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(recChunks, { type: rec.mimeType || "audio/webm" });
        const id = "mo" + Date.now();
        await AudioStore.put(id, blob).catch(() => {});
        P().monologues.push({
          id, promptId: ui.prompt.id, q: ui.prompt.q, domain: ui.prompt.domain,
          at: Date.now(), unlock: Date.now() + 7 * DAY, secs: ui.elapsed,
        });
        logSession("mono", (ui.elapsed || 0) / 60);
        save();
        clearInterval(recTimer); recTimer = null;
        ui = {}; ctx.rerender();
        alert(ts("mnSaved"));
      };
      rec.start();
      ui.recording = true; ui.elapsed = 0;
      recTimer = setInterval(() => { ui.elapsed++; const c = document.querySelector(".clock"); if (c) c.textContent = fmtClock(ui.elapsed); }, 1000);
      ctx.rerender();
    } catch { alert(ts("mnNoMic")); }
  }
  function stopRec() { try { rec?.stop(); } catch {} ui.recording = false; }

  // ── 4. circumlocution ───────────────────────────────────────────────
  let cirTimer = null;
  function renderCircum() {
    const p = P();
    const rate = successRate(p.circum);
    if (!ui.card) {
      return `${hdr("exCircum")}
        <div class="panel">
          <div class="h-row" style="margin:0"><span class="microlabel">${t("crRate")}</span>
            <span class="big-num">${rate === null ? "—" : rate + "٪"}</span></div>
          <div class="microlabel">${ti("crRuns", p.circum.length)}</div>
          <button class="btn btn-primary" id="crGo" style="width:100%; margin-top:0.9rem">${t("crStart")}</button>
          <div class="note-info" style="margin-top:0.7rem">${t("crHow")}</div>
        </div>`;
    }
    const left = ui.left ?? 45;
    return `${hdr("exCircum", true)}
      <div class="panel">
        <div class="countdown ${left <= 10 ? "low" : ""}">${left}</div>
        <div class="concept">${esc(ui.card.concept)}</div>
        <div class="microlabel" style="margin-top:0.9rem">${t("crBanned")}</div>
        <div class="chips banned">${ui.card.banned.map((w) => `<span class="chip no">${esc(w)}</span>`).join("")}</div>
        ${ui.done
          ? `<div class="microlabel" style="margin-top:1rem">${t("crSelfScore")}</div>
             <div class="v-actions">
               <button class="btn btn-primary" data-cr="1" style="flex:1">${t("crPass")}</button>
               <button class="btn btn-danger" data-cr="0" style="flex:1">${t("crFail")}</button>
             </div>`
          : `<button class="btn" id="crStop" style="width:100%; margin-top:1rem">${t("crStop")}</button>`}
      </div>`;
  }
  function wireCircum(el) {
    el.querySelector("#crGo")?.addEventListener("click", () => {
      ui.card = LIB_CIRCUM[Math.floor(Math.random() * LIB_CIRCUM.length)];
      ui.left = 45; ui.done = false; ctx.rerender();
      clearInterval(cirTimer);
      cirTimer = setInterval(() => {
        ui.left--;
        const c = document.querySelector(".countdown");
        if (c) { c.textContent = ui.left; c.classList.toggle("low", ui.left <= 10); }
        if (ui.left <= 0) { clearInterval(cirTimer); ui.done = true; ctx.rerender(); }
      }, 1000);
    });
    el.querySelector("#crStop")?.addEventListener("click", () => { clearInterval(cirTimer); ui.done = true; ctx.rerender(); });
    el.querySelectorAll("[data-cr]").forEach((b) => b.addEventListener("click", () => {
      P().circum.push({ id: "c" + Date.now() + Math.random().toString(36).slice(2, 6),
        d: todayKey(), concept: ui.card.id, ok: b.dataset.cr === "1", sec: 45 - (ui.left || 0) });
      logSession("circum", (45 - (ui.left || 0)) / 60);
      save(); ui = {}; ctx.rerender();
    }));
  }
  const successRate = (arr) => (arr.length ? Math.round((arr.filter((x) => x.ok).length / arr.length) * 100) : null);

  // ── 5. lexicon ──────────────────────────────────────────────────────
  const DOMAINS = [
    { k: "creative", ar: "عمل إبداعي", en: "creative work" },
    { k: "business", ar: "أعمال", en: "business" },
    { k: "politics", ar: "سياسة", en: "politics" },
    { k: "abstract", ar: "مجرد", en: "abstract" },
    { k: "everyday", ar: "يومي", en: "everyday" },
  ];
  /** The phrase rule: never a bare noun. Two words, or a bound demonstrative. */
  function phraseOk(s) {
    const v = (s || "").trim();
    if (!v) return false;
    if (/^(هال|هذا |هذي |هذه |ذاك |ذيچ )/.test(v)) return true;
    return v.split(/\s+/).filter(Boolean).length >= 2;
  }
  function renderLex() {
    const p = P();
    const due = p.lexicon.filter((e) => e.en && (e.sm2?.due || 0) <= Date.now());
    const needs = p.lexicon.filter((e) => !e.en);
    if (ui.lexReview) return renderLexReview();
    return `${hdr("exLex")}
      <div class="panel">
        <div class="day-summary">
          <div class="cell"><b>${p.lexicon.length}</b><span>${ti("lxTotal")}</span></div>
          <div class="cell"><b>${due.length}</b><span>${ti("lxDue")}</span></div>
          <div class="cell"><b>${needs.length}</b><span>${ti("lxIncomplete")}</span></div>
        </div>
        ${due.length ? `<button class="btn btn-primary" id="lxReview" style="width:100%; margin-top:0.9rem">${t("lxStartReview", due.length)}</button>` : ""}
      </div>
      <div class="panel form-grid">
        <div class="microlabel">${t("lxAdd")}</div>
        <label class="f">${t("lxPhrase")} <input id="lxAr" placeholder="مثال: القرار الصعب" /></label>
        <div class="note-info" style="margin-top:-0.3rem">${t("lxPhraseRule")}</div>
        <div style="display:flex; gap:0.6rem">
          <label class="f" style="flex:1">${t("lxGender")}
            <select id="lxGen"><option value="m">مذكر</option><option value="f">مؤنث</option></select></label>
          <label class="f" style="flex:1">${t("lxPlural")} <input id="lxPl" placeholder="القرارات الصعبة" /></label>
        </div>
        <label class="f">${t("lxGloss")} <input id="lxEn" dir="ltr" placeholder="the hard decision" /></label>
        <label class="f">${t("lxSource")} <input id="lxSrc" placeholder="وين سمعتها؟" /></label>
        <label class="f">${t("lxDomain")}
          <select id="lxDom">${DOMAINS.map((d) => `<option value="${d.k}">${d.ar}${bilingual() ? " · " + d.en : ""}</option>`).join("")}</select></label>
        <button class="btn btn-primary" id="lxSave">${t("lxSaveBtn")}</button>
      </div>
      ${needs.length ? `<div class="panel">
        <div class="microlabel">${t("lxNeedsWork")}</div>
        ${needs.slice(0, 20).map((e) => `<div class="word-row"><div class="w-main">
            <span class="w-ar">${esc(e.ar)}</span>
            <div class="w-meta">${esc(e.src || "")} — ${ti("lxAddGloss")}</div></div>
            <button class="btn btn-sm" data-lxfill="${esc(e.id)}">${t("lxComplete")}</button></div>`).join("")}
      </div>` : ""}
      <div class="panel" style="padding:0.3rem 1.1rem">
        ${p.lexicon.filter((e) => e.en).slice(-40).reverse().map((e) => `<div class="word-row"><div class="w-main">
            <span class="w-ar">${esc(e.ar)}</span>
            <div class="w-meta">${esc(domLabel(e.domain))} · ${e.gender === "f" ? "مؤنث" : "مذكر"}${e.plural ? " · " + esc(e.plural) : ""}${e.src ? " · " + esc(e.src) : ""}</div>
          </div><div class="w-en">${esc(e.en)}</div></div>`).join("") || `<div class="empty">${t("lxEmpty")}</div>`}
      </div>`;
  }
  const domLabel = (k) => { const d = DOMAINS.find((x) => x.k === k); return d ? (bilingual() ? d.ar + " · " + d.en : d.ar) : k; };

  function renderLexReview() {
    const e = ui.lexReview;
    return `${hdr("exLex", true)}
      <div class="panel">
        <div class="microlabel">${t("lxProduce")}</div>
        <div class="q-en" style="margin:1.4rem 0; font-size:1.5rem">${esc(e.en)}</div>
        ${ui.lexShown
          ? `<div class="card-ar">${esc(e.ar)}</div>
             <div class="microlabel" style="margin-top:0.5rem">${e.gender === "f" ? "مؤنث" : "مذكر"}${e.plural ? " · " + esc(e.plural) : ""}${e.src ? " · " + esc(e.src) : ""}</div>
             <div class="microlabel" style="margin-top:1rem">${t("lxRate")}</div>
             <div class="grade-row">${[1, 2, 3, 4, 5].map((n) => `<button class="btn" data-sm2="${n}">${n}</button>`).join("")}</div>`
          : `<button class="btn btn-primary" id="lxShow" style="width:100%">${t("lxShow")}</button>
             <div class="flip-hint">${t("lxSayFirst")}</div>`}
      </div>`;
  }
  function wireLex(el) {
    el.querySelector("#lxSave")?.addEventListener("click", () => {
      const ar = document.getElementById("lxAr").value.trim();
      // an empty field is a stray tap (the form re-renders blank after a save),
      // not an attempt to store a bare noun — say nothing rather than scold
      if (!ar) return;
      if (!phraseOk(ar)) return alert(ts("lxRejectBare"));
      const en = document.getElementById("lxEn").value.trim();
      if (!en) return alert(ts("lxNeedGloss"));
      const p = P();
      if (ui.fillId) {
        const e = p.lexicon.find((x) => x.id === ui.fillId);
        Object.assign(e, { ar, en, gender: document.getElementById("lxGen").value,
          plural: document.getElementById("lxPl").value.trim(), src: document.getElementById("lxSrc").value.trim(),
          domain: document.getElementById("lxDom").value, needs: false });
        ui.fillId = null;
      } else {
        p.lexicon.push({ id: "lx" + Date.now(), ar, en,
          gender: document.getElementById("lxGen").value,
          plural: document.getElementById("lxPl").value.trim(),
          src: document.getElementById("lxSrc").value.trim(),
          domain: document.getElementById("lxDom").value,
          sm2: { ef: 2.5, n: 0, int: 0, due: Date.now() } });
      }
      save(); ctx.rerender();
    });
    el.querySelectorAll("[data-lxfill]").forEach((b) => b.addEventListener("click", () => {
      const e = P().lexicon.find((x) => x.id === b.dataset.lxfill);
      ui.fillId = e.id;
      ctx.rerender();
      setTimeout(() => {
        document.getElementById("lxAr").value = e.ar;
        document.getElementById("lxSrc").value = e.src || "";
        document.getElementById("lxEn").focus();
      }, 0);
    }));
    el.querySelector("#lxReview")?.addEventListener("click", () => {
      const due = P().lexicon.filter((e) => e.en && (e.sm2?.due || 0) <= Date.now());
      ui.lexReview = due[0]; ui.lexShown = false; ctx.rerender();
    });
    el.querySelector("#lxShow")?.addEventListener("click", () => { ui.lexShown = true; ctx.rerender(); });
    el.querySelectorAll("[data-sm2]").forEach((b) => b.addEventListener("click", () => {
      const e = P().lexicon.find((x) => x.id === ui.lexReview.id);
      e.sm2 = sm2(e.sm2, +b.dataset.sm2);
      save();
      const due = P().lexicon.filter((x) => x.en && (x.sm2?.due || 0) <= Date.now());
      ui.lexReview = due[0] || null; ui.lexShown = false;
      ctx.rerender();
    }));
  }

  // ── 6. message bank ─────────────────────────────────────────────────
  function renderMsg() {
    const p = P();
    const rows = [...p.msgs].sort((a, b) => (a.last || 0) - (b.last || 0));
    return `${hdr("exMsg")}
      <div class="panel">
        <div class="note-info">${t("mgIntro")}</div>
        <div class="chips" style="margin-top:0.6rem">
          ${LIB_MSG.filter((q) => !p.msgs.some((m) => m.q === q.q)).slice(0, 8)
            .map((q) => `<button class="chip" data-mgadd="${esc(q.q)}">＋ ${esc(q.q)}</button>`).join("")}
        </div>
      </div>
      ${ui.mgEdit !== undefined ? msgForm(ui.mgEdit) : `<button class="btn btn-primary" id="mgNew" style="width:100%">${t("mgAdd")}</button>`}
      ${rows.map((m) => {
        const days = m.last ? Math.floor((Date.now() - m.last) / DAY) : null;
        const stale = days === null || days > 30;
        return `<div class="panel">
          <div class="src-title">${esc(m.q)}</div>
          <div class="msg-answer">${esc(m.a || "")}</div>
          <div class="h-row" style="margin:0.6rem 0 0">
            <span class="microlabel ${stale ? "stale" : ""}">${m.reps || 0} ${ts("mgReps")} · ${days === null ? ts("mgNever") : ti("mgDaysAgo", days)}</span>
            <div class="v-actions" style="margin:0">
              <button class="btn btn-sm btn-primary" data-mgrehearse="${esc(m.id)}">${t("mgRehearsed")}</button>
              <button class="btn btn-sm" data-mgedit="${esc(m.id)}">${t("mgEdit")}</button>
            </div>
          </div>
        </div>`;
      }).join("")}`;
  }
  function msgForm(m) {
    return `<div class="panel form-grid">
      <label class="f">${t("mgQ")} <input id="mgQ" value="${esc(m?.q || "")}" /></label>
      <label class="f">${t("mgA")} <textarea id="mgA" rows="5">${esc(m?.a || "")}</textarea></label>
      <div class="v-actions">
        <button class="btn btn-primary" id="mgSave">${t("mgSave")}</button>
        <button class="btn btn-ghost" id="mgCancel">${t("close")}</button>
      </div>
    </div>`;
  }
  function wireMsg(el) {
    el.querySelector("#mgNew")?.addEventListener("click", () => { ui.mgEdit = null; ctx.rerender(); });
    el.querySelectorAll("[data-mgadd]").forEach((b) => b.addEventListener("click", () => {
      ui.mgEdit = { q: b.dataset.mgadd, a: "" }; ctx.rerender();
    }));
    el.querySelectorAll("[data-mgedit]").forEach((b) => b.addEventListener("click", () => {
      ui.mgEdit = P().msgs.find((m) => m.id === b.dataset.mgedit); ctx.rerender();
    }));
    el.querySelector("#mgSave")?.addEventListener("click", () => {
      const q = document.getElementById("mgQ").value.trim();
      const a = document.getElementById("mgA").value.trim();
      if (!q) return;
      const p = P();
      if (ui.mgEdit?.id) Object.assign(p.msgs.find((m) => m.id === ui.mgEdit.id), { q, a });
      else p.msgs.push({ id: "mg" + Date.now(), q, a, reps: 0, last: null });
      ui.mgEdit = undefined; save(); ctx.rerender();
    });
    el.querySelector("#mgCancel")?.addEventListener("click", () => { ui.mgEdit = undefined; ctx.rerender(); });
    el.querySelectorAll("[data-mgrehearse]").forEach((b) => b.addEventListener("click", () => {
      const m = P().msgs.find((x) => x.id === b.dataset.mgrehearse);
      m.reps = (m.reps || 0) + 1; m.last = Date.now();
      logSession("msg", 1); save(); ctx.rerender();
    }));
  }

  // ── dashboard ───────────────────────────────────────────────────────
  const EX_KEYS = [
    { k: "shadow", labelKey: "exShadow" }, { k: "read", labelKey: "exRead" },
    { k: "mono", labelKey: "exMono" }, { k: "circum", labelKey: "exCircum" },
  ];
  function renderDash() {
    const p = P();
    const since = Date.now() - 30 * DAY;
    const recent = p.sessions.filter((s) => new Date(s.d).getTime() >= since);
    const byType = {};
    for (const s of recent) byType[s.type] = (byType[s.type] || 0) + s.min;
    const maxMin = Math.max(1, ...Object.values(byType));
    const totalMin = Math.round(Object.values(byType).reduce((a, b) => a + b, 0));

    const byDomain = {};
    for (const e of p.lexicon) byDomain[e.domain] = (byDomain[e.domain] || 0) + 1;
    const maxDom = Math.max(1, ...Object.values(byDomain));

    // circumlocution success in weekly buckets, oldest first
    const weeks = [];
    for (let w = 4; w >= 0; w--) {
      const lo = Date.now() - (w + 1) * 7 * DAY, hi = Date.now() - w * 7 * DAY;
      const runs = p.circum.filter((c) => { const t2 = new Date(c.d).getTime(); return t2 >= lo && t2 < hi; });
      weeks.push({ n: runs.length, rate: runs.length ? Math.round((runs.filter((r) => r.ok).length / runs.length) * 100) : null });
    }
    const pending = p.monologues.filter((m) => !m.rating && m.unlock <= Date.now()).length;

    return `
      <div class="h-row"><h2>${t("dashTitle")}</h2></div>
      <div class="stat-grid">
        <div class="panel" style="margin:0"><b style="font-size:1.6rem">${ctx.streak()}</b><div class="microlabel">${t("statStreak")}</div></div>
        <div class="panel" style="margin:0"><b style="font-size:1.6rem">${totalMin}</b><div class="microlabel">${t("dashMinutes")}</div></div>
        <div class="panel" style="margin:0"><b style="font-size:1.6rem">${p.lexicon.length}</b><div class="microlabel">${t("dashLexicon")}</div></div>
        <div class="panel" style="margin:0"><b style="font-size:1.6rem">${pending}</b><div class="microlabel">${t("dashPending")}</div></div>
      </div>

      <div class="panel" style="margin-top:0.9rem">
        <div class="microlabel">${t("dashByType")}</div>
        ${totalMin ? EX_KEYS.map((e) => {
          const v = Math.round(byType[e.k] || 0);
          return `<div class="hbar-row">
            <span class="hbar-label"><i style="background:${EX_COLORS[e.k]}"></i>${t(e.labelKey)}</span>
            <span class="hbar-track"><span class="hbar-fill" style="width:${(v / maxMin) * 100}%; background:${EX_COLORS[e.k]}"></span></span>
            <span class="hbar-val">${v}</span></div>`;
        }).join("") : `<div class="empty">${t("dashNoData")}</div>`}
      </div>

      <div class="panel">
        <div class="microlabel">${t("dashDomains")}</div>
        ${p.lexicon.length ? DOMAINS.map((d) => {
          const v = byDomain[d.k] || 0;
          return `<div class="hbar-row">
            <span class="hbar-label">${esc(bilingual() ? d.ar + " · " + d.en : d.ar)}</span>
            <span class="hbar-track"><span class="hbar-fill" style="width:${(v / maxDom) * 100}%; background:var(--green)"></span></span>
            <span class="hbar-val">${v}</span></div>`;
        }).join("") : `<div class="empty">${t("dashNoLex")}</div>`}
      </div>

      <div class="panel">
        <div class="microlabel">${t("dashCircum")}</div>
        ${p.circum.length ? trendSvg(weeks) : `<div class="empty">${t("dashNoCircum")}</div>`}
      </div>`;
  }

  /** Five weekly points, 2px line, 8px markers, direct label on the last. */
  function trendSvg(weeks) {
    const W = 300, H = 90, pad = 18;
    const pts = weeks.map((w, i) => ({
      x: pad + (i * (W - pad * 2)) / (weeks.length - 1),
      y: w.rate === null ? null : H - pad - ((w.rate / 100) * (H - pad * 2)),
      rate: w.rate, n: w.n,
    }));
    const line = pts.filter((p2) => p2.y !== null);
    const d = line.map((p2, i) => `${i ? "L" : "M"}${p2.x.toFixed(1)},${p2.y.toFixed(1)}`).join(" ");
    const last = line[line.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" class="trend" role="img"
        aria-label="${esc(ts("dashCircum"))}: ${weeks.map((w) => (w.rate === null ? "—" : w.rate + "%")).join(", ")}">
      ${[0, 50, 100].map((g) => { const y = H - pad - (g / 100) * (H - pad * 2);
        return `<line x1="${pad}" x2="${W - pad}" y1="${y}" y2="${y}" stroke="rgb(233 237 243 / 0.10)" stroke-width="1"/>
                <text x="${pad - 4}" y="${y + 3}" text-anchor="end" font-size="8" fill="rgb(233 237 243 / 0.4)">${g}</text>`; }).join("")}
      ${line.length > 1 ? `<path d="${d}" fill="none" stroke="${EX_COLORS.circum}" stroke-width="2" stroke-linejoin="round"/>` : ""}
      ${line.map((p2) => `<circle cx="${p2.x.toFixed(1)}" cy="${p2.y.toFixed(1)}" r="4"
          fill="${EX_COLORS.circum}" stroke="var(--bg-card)" stroke-width="2"><title>${p2.rate}٪ · ${p2.n}</title></circle>`).join("")}
