f out, figure it out",reg:"kw",topic:"يومي",ex:"ماكو مواصلات — دبّر حالك."},{id:"sl14",ar:"على السريع",tr:"ʿas-sarīʿ",en:"quickly, in brief",reg:"phrase",topic:"يومي",ex:"عطني الخلاصة على السريع، عندي اجتماع."}]}]</script><script>const SEED_GENDER=[{id:"gn01",prompt:"الطريق لبيتهم ___ وايد.",options:["طويل","طويلة"],answer:0,rule:"«الطريق» مذكر. اللي يغلط ينساق وراء «الطريقة» — وهذي كلمة ثانية تمامًا ومؤنثة.",en:"الطريق (road) is masculine; people slip because الطريقة (method) is feminine."},{id:"gn02",prompt:"السوق ___ اليوم بشكل قوي.",options:["ارتفع","ارتفعت"],answer:0,rule:"«السوق» مذكر بالاستخدام المالي والعام. تسمع «السوق ارتفعت» وايد، وهي غلط شائع.",en:"السوق (market) is masculine — a very common slip when talking markets."},{id:"gn03",prompt:"النار ___ بسرعة بسبب الهوا.",options:["انتشرت","انتشر"],answer:0,rule:"«النار» مؤنثة رغم إنها ما تنتهي بتاء مربوطة.",en:"النار (fire) is feminine despite having no feminine ending."},{id:"gn04",prompt:"الشمس ___ من الشرق.",options:["تطلع","يطلع"],answer:0,rule:"«الشمس» مؤنثة و«القمر» مذكر — ثنائي كلاسيكي يستاهل يترسخ.",en:"الشمس (sun) feminine, القمر (moon) masculine."},{id:"gn05",prompt:"الأرض اللي شريناها ___ بموقع ممتاز.",options:["واقعة","واقع"],answer:0,rule:"«الأرض» مؤنثة دايمًا.",en:"الأرض (land) is always feminine."},{id:"gn06",prompt:"الحرب ___ عقب سنتين.",options:["انتهت","انتهى"],answer:0,rule:"«الحرب» مؤنثة.",en:"الحرب (war) is feminine."},{id:"gn07",prompt:"السماء ___ اليوم، عسى تمطر.",options:["ملبدة","ملبد"],answer:0,rule:"«السماء» مؤنثة.",en:"السماء (sky) is feminine."},{id:"gn08",prompt:"يدي ___ من أمس، لعبت بادل وايد.",options:["توجعني","يوجعني"],answer:0,rule:"أعضاء الجسم المزدوجة مؤنثة: اليد، العين، الأذن، الرجل.",en:"Paired body parts are feminine: hand, eye, ear, leg."},{id:"gn09",prompt:"عيني اليمين ___ من الشاشة.",options:["تعبت","تعب"],answer:0,rule:"«العين» مؤنثة — نفس قاعدة الأعضاء المزدوجة.",en:"العين (eye) is feminine — same paired-organ rule."},{id:"gn10",prompt:"البئر ___ من زمان.",options:["جافة","جاف"],answer:0,rule:"«البئر» مؤنثة، وهذي يغلط فيها حتى المتمكنين.",en:"البئر (well) is feminine — even confident speakers miss this one."},{id:"gn11",prompt:"روحي ___ من كثر الشغل.",options:["مرهقة","مرهق"],answer:0,rule:"«الروح» و«النفس» الاثنتين مؤنثات.",en:"الروح (soul) and النفس (self) are both feminine."},{id:"gn12",prompt:"الفلوس اللي حوّلتها ___ أمس.",options:["وصلت","وصلوا"],answer:0,rule:"جمع غير العاقل يعامَل معاملة المفرد المؤنث — «وصلت» مو «وصلوا».",en:"Non-human plurals take FEMININE SINGULAR agreement, never the human plural."},{id:"gn13",prompt:"السيارات كلها ___ بالكراج.",options:["موجودة","موجودين"],answer:0,rule:"نفس القاعدة: السيارات جمع غير عاقل ← مفرد مؤنث.",en:"Same rule — cars are non-human, so feminine singular."},{id:"gn14",prompt:"المشاريع ___ كلها بسبب الميزانية.",options:["تأخرت","تأخروا"],answer:0,rule:"«تأخروا» تنقال للبشر بس. المشاريع ← «تأخرت».",en:"تأخروا is for people only; projects take تأخرت."},{id:"gn15",prompt:"الاجتماعات الأسبوع الياي ___ ثلاثة.",options:["صارت","صاروا"],answer:0,rule:"جمع غير عاقل ← مفرد مؤنث، حتى لو العدد كبير.",en:"Non-human plural stays feminine singular regardless of count."},{id:"gn16",prompt:"الناس ___ إن الأسعار بترتفع.",options:["تقول","يقولون"],answer:0,rule:"«الناس» بالفصحى تاخذ مفرد مؤنث: «الناس تقول». بالكويتي اليومي تسمع «الناس يقولون» وهي مقبولة بالحچي، بس بالكتابة الرسمية «تقول».",en:"In MSA الناس takes feminine singular; the plural form is tolerated in casual Kuwaiti but not in formal writing."},{id:"gn17",prompt:"عندنا ___ شركات بالمجموعة.",options:["ثلاث","ثلاثة"],answer:0,rule:"قاعدة عكس العدد: «شركة» مؤنثة ← العدد يجي مذكر «ثلاث». الأعداد من ٣ إلى ١٠ تخالف المعدود.",en:"Numbers 3–10 REVERSE gender: a feminine noun (شركة) takes the masculine-form number ثلاث."},{id:"gn18",prompt:"خلصنا ___ مشاريع هالسنة.",options:["ثلاثة","ثلاث"],answer:0,rule:"«مشروع» مذكر ← العدد يجي مؤنث «ثلاثة». نفس قاعدة العكس بالاتجاه الثاني.",en:"The same reversal the other way: masculine مشروع takes ثلاثة."},{id:"gn19",prompt:"الكويت ___ بموقع استراتيجي.",options:["تتميز","يتميز"],answer:0,rule:"أسماء الدول والمدن مؤنثة.",en:"Country and city names are feminine."},{id:"gn20",prompt:"الميزانية اللي اعتمدوها ___ ما تكفي.",options:["صارت","صار"],answer:0,rule:"«ميزانية» مؤنثة بوضوح — بس الخطأ يصير لما تبعد الصفة عن الاسم بجملة طويلة.",en:"Obvious on its own; the trap is distance — a long clause between noun and verb."},{id:"gn21",prompt:"القطاع الخاص ___ فرص أكثر.",options:["يوفر","توفر"],answer:0,rule:"«قطاع» مذكر. الالتباس يجي لأن «الشركات» اللي بذهنك مؤنثة.",en:"قطاع is masculine; the pull comes from thinking of الشركات."},{id:"gn22",prompt:"الوزارة ___ بيان أمس.",options:["أصدرت","أصدر"],answer:0,rule:"«الوزارة» و«الهيئة» و«المؤسسة» كلهن مؤنثات، حتى لو اللي يتكلم باسمهن رجال.",en:"Institutions ending in ة are feminine regardless of who runs them."},{id:"gn23",prompt:"المجلس ___ الجلسة لباچر.",options:["أجّل","أجّلت"],answer:0,rule:"«المجلس» مذكر، بعكس «الجلسة» المؤنثة — والاثنتين بنفس الجملة فخ.",en:"المجلس masculine, الجلسة feminine — both in one sentence is the trap."},{id:"gn24",prompt:"الحال ___ مثل ما هو.",options:["باقي","باقية"],answer:0,rule:"«الحال» مذكر بالاستخدام الشائع.",en:"الحال is masculine in common usage."},{id:"gn25",prompt:"تكلم ويا أختك: «شلون___ اليوم؟»",options:["چ","ك"],answer:0,rule:"مخاطبة المؤنث بالكويتي تاخذ «ـچ»: شلونچ، عندچ، وياچ، بيتچ. وهذي أوضح بصمة كويتية.",en:"Addressing a woman in Kuwaiti takes ‑چ everywhere: شلونچ، عندچ، وياچ. One of the clearest Kuwaiti markers."},{id:"gn26",prompt:"قول لأمك: «عساچ ___ القوة».",options:["على","عن"],answer:0,rule:"«عساچ على القوة» — بالمؤنث تصير الكاف چاف. لاحظ إن التحية نفسها ما تتغير.",en:"The greeting keeps its shape; only the suffix changes to ‑چ."},{id:"gn27",prompt:"تسأل صديقتك: «___ تروحين وياي؟»",options:["تبين","تبي"],answer:0,rule:"الفعل المضارع للمؤنثة ياخذ نون: تبين، تروحين، تسوين. الغلط الشائع إنك تستخدم صيغة المذكر.",en:"Feminine present-tense verbs take the ‑īn ending: تبين، تروحين، ت
