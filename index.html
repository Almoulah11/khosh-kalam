<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>خوش كلام — تدريب اللهجة الكويتية</title>
  <meta name="description" content="مدرّب مفردات اللهجة الكويتية — تكرار متباعد واسترجاع نشط" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">خوش كلام</span>
      <span class="brand-sub">تدريب اللهجة الكويتية</span>
    </div>
    <div class="topbar-right">
      <div class="langtoggle" role="group" aria-label="اللغة / Language">
        <button type="button" data-lang="bi">ع + EN</button>
        <button type="button" data-lang="ar">ع</button>
      </div>
      <span class="syncdot idle" id="syncDot" aria-hidden="true"></span>
      <div class="streak" id="streakBadge">🔥 <span id="streakCount">0</span></div>
    </div>
  </header>

  <main id="stage"><!-- rendered by app.js --></main>

  <nav class="tabs" id="tabs">
    <button data-view="today" data-i18n="tabToday" class="tab active"><span class="tab-ico">◉</span><span class="tab-label"></span></button>
    <button data-view="arena" data-i18n="tabArena" class="tab"><span class="tab-ico">◆</span><span class="tab-label"></span></button>
    <button data-view="words" data-i18n="tabWords" class="tab"><span class="tab-ico">☰</span><span class="tab-label"></span></button>
    <button data-view="verify" data-i18n="tabVerify" class="tab"><span class="tab-ico">؟</span><span class="tab-label"></span><span class="pill" id="verifyPill"></span></button>
    <button data-view="packs" data-i18n="tabPacks" class="tab"><span class="tab-ico">◫</span><span class="tab-label"></span></button>
    <button data-view="stats" data-i18n="tabStats" class="tab"><span class="tab-ico">↗</span><span class="tab-label"></span></button>
  </nav>

  <script src="js/fsrs.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/seed-manual.js"></script>
  <script src="js/seed-packs.js"></script>
  <script src="js/seed-verify.js"></script>
  <script src="js/seed-responses.js"></script>
  <script src="js/seed-domains.js"></script>
  <script src="js/seed-colloquial.js"></script>
  <script src="js/seed-drills.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
